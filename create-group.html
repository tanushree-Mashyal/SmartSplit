    <header>
        <h1>SplitTrack</h1>
        <p>Create New Group</p>
    </header>


    <main>

        <section>

            <form id="createGroupForm">

    <label for="groupName">
        Group Name
    </label>

    <input
        type="text"
        id="groupName"
        placeholder="Example: Goa Trip"
        required
    >

    <label for="members">
        Number of Members
    </label>

    <input
        type="number"
        id="members"
        placeholder="Example: 5"
        min="1"
        required
    >

    <div id="memberInputs"></div>

    <button type="submit">
        Create Group
    </button>

</form>
        </section>

    </main>


    <script src="create-group.js"></script>
    <script src="data.js"></script>

</body>
